[package]
name = "sockcast-relay"
version = "0.1.0"
edition = "2021"
description = "Roaming SSH Agent Target Host Relay (systemd socket-activated Linux user session daemon)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/theraphim/sockcast-relay"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
libc = "0.2"
prost = "0.13"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sockcast-proto = { path = "sockcast-proto" }
thiserror = "2"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "signal", "rt-multi-thread", "macros", "fs"] }
toml = "0.8"
tonic = { version = "0.12", features = ["transport"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
tokio-stream = { version = "0.1", features = ["net"] }

