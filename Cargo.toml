[package]
name = "sshcast-relay"
version = "0.1.0"
edition = "2021"
description = "Roaming SSH Agent Target Host Relay (systemd socket-activated Linux user session daemon)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sshcast/sshcast-relay"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
flate2 = "1"
hex = "0.4"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
prost = "0.13"
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sshcast-proto = { path = "sshcast-proto" }
thiserror = "2"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "signal", "rt-multi-thread", "macros", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
tokio-stream = { version = "0.1", features = ["net"] }
toml = "0.8"
tonic = { version = "0.12", features = ["transport", "tls-native-roots", "tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webpki-roots = "0.26"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 16

