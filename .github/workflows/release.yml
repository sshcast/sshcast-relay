name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.arch_label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            nfpm_arch: amd64
            arch_label: x86_64
          - os: ubuntu-24.04-arm
            nfpm_arch: arm64
            arch_label: aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Go (for nfpm)
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.1

      - name: Build release binary
        run: cargo build --release --locked

      - name: Run tests
        run: cargo test --release --locked

      - name: Resolve package version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep -E '^Version:' sshcast-relay.spec | awk '{print $2}')"
          fi
          echo "NFPM_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Package .tar.gz, .deb, and .rpm
        shell: bash
        env:
          NFPM_ARCH: ${{ matrix.nfpm_arch }}
        run: |
          mkdir -p dist-stage artifacts
          cp target/release/sshcast-relay dist-stage/
          cp README.md LICENSE-MIT LICENSE-APACHE dist-stage/
          cp -r systemd dist-stage/
          cp -r doc dist-stage/
          tar -C dist-stage -czf "artifacts/sshcast-relay-linux-${{ matrix.arch_label }}.tar.gz" .
          nfpm package --config nfpm.yaml --packager deb --target artifacts/
          nfpm package --config nfpm.yaml --packager rpm --target artifacts/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-assets-${{ matrix.arch_label }}
          path: artifacts/*

  release:
    name: Release & Attest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          (cd release-assets && sha256sum -- * > ../SHA256SUMS.txt)
          mv SHA256SUMS.txt release-assets/SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-assets/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
